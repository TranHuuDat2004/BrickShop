name: Docker Keep Alive

on:
  schedule:
    # Chạy vào lúc 00:00 ngày 1 hàng tháng
    - cron: '0 0 1 * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công

jobs:
  pull-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Image
        run: |
          docker pull huudatlego/re-shopping-cart-website:latest
          
      - name: Re-tag and Push (Tùy chọn)
        run: |
          # Việc push lại sẽ chắc chắn cập nhật thời gian "Last pushed"
          docker tag huudatlego/re-shopping-cart-website:latest huudatlego/brickshop:latest
          docker push huudatlego/brickshop:latest
